<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc"><title id="title">Fixed sensor above a rotating magnet</title><desc id="desc">The PCB back is taped to the inside of the fixed cover. The AS5600 chip faces down towards the magnet. The centred magnet is retained in the rotating lever collar, with an initial 1 to 2 millimetre gap between the magnet face and chip package. The pivot pin enters a separate blind hole below.</desc><defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#183c35}.label{font-size:17px;font-weight:650}.small{font-size:14px;fill:#596b64}</style></defs><rect width="900" height="380" rx="12" fill="#e8eee3"/><rect x="70" y="58" width="315" height="24" rx="3" fill="#b74951"/><rect x="105" y="86" width="245" height="8" fill="#a8bd99"/><rect x="95" y="98" width="265" height="17" fill="#fffef9" stroke="#bfcbbc"/><rect x="190" y="115" width="68" height="22" fill="#183c35"/><rect x="132" y="206" width="184" height="65" fill="#ce5827"/><rect x="191" y="206" width="66" height="24" fill="#87999a"/><rect x="203" y="250" width="42" height="80" fill="#b08d43"/><rect x="110" y="287" width="230" height="40" fill="#465d57"/><rect x="203" y="287" width="42" height="40" fill="#b08d43"/><path d="M224 37V348" stroke="#71877a" stroke-width="1" stroke-dasharray="6 6"/><path d="M293 143V198M287 151L293 143L299 151M287 190L293 198L299 190" fill="none" stroke="#216d8a" stroke-width="2"/><text x="430" y="78" class="label">Cover stays fixed</text><text x="430" y="109" class="small">PCB back → thin insulating tape → cover roof</text><text x="430" y="141" class="label">Chip faces the magnet</text><text x="430" y="177" class="label" style="fill:#216d8a">Start with a 1–2 mm air gap</text><text x="430" y="207" class="small">Measure to the chip package, not the PCB.</text><text x="430" y="246" class="label" style="fill:#ce5827">Magnet + lever rotate together</text><text x="430" y="277" class="small">Centre the magnet on the pivot / chip axis.</text><text x="430" y="316" class="label">Pivot pin enters from the base</text><text x="70" y="365" class="small">Schematic, not a scale drawing. Validate the magnetic status and clearances throughout the full travel.</text></svg>
